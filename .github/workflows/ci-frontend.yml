# Frontend Next.js : contrôle qualité puis publication de l'image Docker.
# Repris du workflow de Refont : lint + format, build, tests de bout en bout
# (Playwright + axe), Lighthouse. L'image n'est publiée que sur main, après les tests.
name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  # Sur main, on ne coupe jamais une publication d'image en cours.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint et format
        run: |
          pnpm lint
          pnpm format:check

      - name: Build (vérifie aussi les types)
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.x autorun

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-front:
    needs: qualite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./frontend
          file: frontend/build.Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/final-project-study-frontend:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.dany-sk-fsp.com