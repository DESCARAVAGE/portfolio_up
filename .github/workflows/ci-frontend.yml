# Frontend Next.js : contrôle qualité puis publication de l'image Docker.
# Repris du workflow de Refont : lint + format, tests unitaires, build, tests de bout en bout
# (Playwright + axe), Lighthouse. L'image n'est publiée que sur main, après les tests.
name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  # Sur main, on ne coupe jamais une publication d'image en cours.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3100' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint et format
        run: |
          pnpm lint
          pnpm format:check

      - name: Tests unitaires (Vitest)
        run: pnpm test:unit

      - name: Build (vérifie aussi les types)
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.x autorun

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Sur une PR : l'image est construite pour vérifier le Dockerfile, sans être publiée.
  # Sur main : construite puis publiée sur Docker Hub.
  docker-front:
    needs: qualite
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Sans secrets (PR Dependabot, fork), un nom local : l'image n'est pas publiée de toute façon.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/final-project-study-frontend
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version du site lue dans frontend/package.json (2.0.0 → tags 2.0.0, 2.0 et 2)
      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ env.PUBLISH == 'true' }}
          context: ./frontend
          file: frontend/build.Dockerfile
          # latest reste utilisé par fetch-and-deploy.sh ; les autres tags permettent un retour arrière précis
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.full }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.dany-sk-fsp.com
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}