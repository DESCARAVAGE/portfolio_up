# Frontend Next.js : contrôle qualité puis publication de l'image Docker.
# Repris du workflow de Refont : lint + format, build, tests de bout en bout
# (Playwright + axe), Lighthouse. L'image n'est publiée que sur main, après les tests.
name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  # Sur main, on ne coupe jamais une publication d'image en cours.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint et format
        run: |
          pnpm lint
          pnpm format:check

      - name: Build (vérifie aussi les types)
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.x autorun

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-front:
    needs: qualite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cleanup: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version du site lue dans frontend/package.json (2.0.0 → tags 2.0.0, 2.0 et 2)
      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          push: true
          context: ./frontend
          file: frontend/build.Dockerfile
          # latest reste utilisé par fetch-and-deploy.sh ; les autres tags permettent un retour arrière précis
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/final-project-study-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/final-project-study-frontend:${{ steps.version.outputs.full }}
            ${{ secrets.DOCKERHUB_USERNAME }}/final-project-study-frontend:${{ steps.version.outputs.minor }}
            ${{ secrets.DOCKERHUB_USERNAME }}/final-project-study-frontend:${{ steps.version.outputs.major }}
            ${{ secrets.DOCKERHUB_USERNAME }}/final-project-study-frontend:sha-${{ steps.version.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.dany-sk-fsp.com
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}