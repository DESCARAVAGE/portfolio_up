# Frontend Next.js : contrôle qualité puis publication de l'image Docker.
# Repris du workflow de Refont : audit, lint + format, tests unitaires, build, tests de bout en
# bout (Playwright + axe), Lighthouse. L'image est construite sur chaque PR et publiée
# seulement sur main, après les tests.
name: frontend-ci

on:
  # Push : main et dev seulement (les autres branches passent par leur pull request)
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

# Lecture seule : le workflow ne peut rien modifier dans le dépôt
permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  # Sur main, on ne coupe jamais une publication d'image en cours.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3100' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Une faille élevée ou critique dans une dépendance livrée au site bloque la CI
      - name: Audit des dépendances
        run: pnpm audit --prod --audit-level high

      - name: Lint et format
        run: |
          pnpm lint
          pnpm format:check

      - name: Tests unitaires (Vitest)
        run: pnpm test:unit

      - name: Build (vérifie aussi les types)
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.x autorun

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Sur une PR : l'image est construite pour vérifier le Dockerfile, sans être publiée.
  # Sur main : construite puis publiée sur Docker Hub.
  docker-front:
    needs: qualite
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Sans secrets (PR Dependabot, fork), un nom local : l'image n'est pas publiée de toute façon.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/final-project-study-frontend
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cleanup: false

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version du site lue dans frontend/package.json (2.0.0 → tags 2.0.0, 2.0 et 2).
      # Une version publiée ne change plus : ses tags ne sont posés qu'à sa première
      # publication ; ensuite, seuls latest et sha-… suivent main. Nouvelle version =
      # monter `version` dans frontend/package.json.
      - name: Version et tags
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          SHA=${GITHUB_SHA::7}
          TAGS="$IMAGE:latest,$IMAGE:sha-$SHA"
          NEW_VERSION=true
          if [ "$PUBLISH" = "true" ]; then
            if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2> manifest.err; then
              NEW_VERSION=false
              echo "::notice::Version $VERSION déjà publiée : seuls latest et sha-$SHA sont mis à jour"
            elif ! grep -qiE "no such manifest|manifest unknown|not found" manifest.err; then
              # Réseau, limite de requêtes… : on ne sait pas, on ne risque pas d'écraser la version
              cat manifest.err; echo "::error::Impossible de vérifier si $VERSION est déjà publiée"; exit 1
            fi
          fi
          if [ "$NEW_VERSION" = "true" ]; then
            TAGS="$TAGS,$IMAGE:$VERSION,$IMAGE:${VERSION%.*},$IMAGE:${VERSION%%.*}"
          fi
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          push: ${{ env.PUBLISH == 'true' }}
          context: ./frontend
          file: frontend/build.Dockerfile
          # latest reste utilisé par fetch-and-deploy.sh ; les autres tags permettent un retour arrière précis
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.dany-sk-fsp.com
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}