# .github/workflows/jest-backend-ci.yml
name: jest-backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/jest-ci-backend.yml"
  #   branches:
  #     - dev
  # pull_request:
  #   branches:
  #     - main
  #     - dev

jobs:
  test-back:
    runs-on: ubuntu-latest
    container: node:lts-alpine

    services:
      db:
        image: postgres
        env:
          POSTGRES_DB: ${{ secrets.DATABASE }}
          POSTGRES_USER: ${{ secrets.USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Go to backend
        env:
          PORT: ${{ secrets.PORT }}
          HOST: ${{ secrets.HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DATABASE: ${{ secrets.DATABASE }}
          # JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: cd backend && npm i && npm run test
    
  # Hors main : l'image est construite pour vérifier le Dockerfile, sans être publiée.
  # Sur main : construite puis publiée sur Docker Hub.
  docker-back:
    needs: test-back
    runs-on: ubuntu-latest
    env:
      # Sans secrets (PR Dependabot, fork), un nom local : l'image n'est pas publiée de toute façon.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/final-project-study-backend
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          context: ./backend
          file: backend/build.Dockerfile
          tags: ${{ env.IMAGE }}:latest

      # L'image est publique : elle ne doit contenir aucun CV (il est monté depuis le serveur).
      - name: Aucun CV dans l'image
        if: env.PUBLISH != 'true'
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE }}:latest \
            -c 'test -d storage && test -z "$(ls -A storage)" && echo "storage/ vide"'
