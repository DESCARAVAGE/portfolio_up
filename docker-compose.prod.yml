# Journaux Docker limités (10 Mo × 5 fichiers par service) : voir la page Confidentialité.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: descaravage/final-project-study-backend:latest
    pull_policy: always
    env_file: .env.backend
    restart: unless-stopped
    logging: *logging
    # Le CV vit sur le serveur, pas dans l'image publique. Chemin à adapter si besoin.
    volumes:
      - /home/debian/cv-storage:/app/storage:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: descaravage/final-project-study-frontend:latest
    pull_policy: always
    env_file: .env.frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend

  db:
    image: postgres:16
    restart: always
    env_file: .env.db
    logging: *logging
    volumes:
      - /home/debian/postgres-data/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d db_portfolio -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.28.2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    logging: *logging
    ports:
      - ${GATEWAY_PORT:-8000}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
